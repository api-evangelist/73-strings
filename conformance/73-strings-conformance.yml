regulatory_context:
  sector: private markets / alternative asset management
  note: >-
    73 Strings is a software vendor to regulated fund managers, not a regulated financial
    institution itself. Its API surface carries no PSD2/FDX/Open Banking conformance and asserts
    none. Data residency is implied by the separate EU ("accord-eut") and US APIM instances.
