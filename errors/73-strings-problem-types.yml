format: proprietary
rfc9457: false
description: >-
  73 Strings does not use RFC 9457 problem+json. Every operation returns the same
  application/json envelope on success and on failure, and a business-level failure can be carried
  on an HTTP 200. Agents must read `success` and `errorCode`, not the HTTP status alone.

envelope:
  media_type: application/json
  fields:
  - {name: response, description: Payload on success; empty array/object on failure}
  - {name: success, type: boolean}
  - {name: message, type: string, description: Human-readable outcome message}
  - {name: errorCode, type: string, description: 73 Strings error code; null on success}
  example_failure: '{"response": [], "success": false, "message": "Data not found.", "errorCode": "EXCE00021"}'

error_codes:
- code: EXCE00020
  http_status: [400]
  message: Fields cannot be null or empty.
  meaning: A required field in the request body was omitted, null, or an empty string.
  remediation: >-
    Populate every required field for the operation. orgId and userId are mandatory on every
    request across the whole surface.
- code: EXCE00021
  http_status: [200]
  message: Data not found.
  meaning: >-
    The request was well-formed and authorized but matched no records in the caller's organization.
    Documented as a "No Data Example" on HTTP 200, not on 404.
  remediation: >-
    Treat as an empty result, not a transport failure. Verify entity/company identifiers exist in
    the organization and that the version/reporting-date filters are in range.
- code: EXCE00028
  http_status: [400, 401, 500]
  messages:
  - Invalid input, please try again
  - Invalid request parameters.
  - Access denied due to invalid subscription key. Please provide a valid key with active subscription.
  - Internal server error. Please try again later or contact support.
  meaning: >-
    A general-purpose code reused across malformed input, subscription-key rejection, and server
    faults. The HTTP status and `message` field disambiguate it, not the code.
  remediation: >-
    On 401, confirm the subscription-key header carries a key with an active APIM product
    subscription. On 400, validate the request body against the operation schema. On 500, retry
    with backoff and contact support@73strings.com.
- code: VALIDATION_ERROR
  http_status: [422]
  meaning: >-
    Per-object validation failure in bulk transaction ingestion. The response identifies which
    submitted transaction objects failed and why.
  remediation: >-
    Correct the identified objects and resubmit. Successfully validated objects in the same batch
    are reported separately via HTTP 207.
  operations: [unifiedTransaction-v2, unifiedTransaction, GTN_FUND_TRANSACTION]

