  schemas: [TransactionVersionData]
- name: Fund
  id_field: fundId
  description: A fund vehicle; target of putfundTransactions (GTN_FUND_TRANSACTION).
  schemas: [FundDTO, FundDetailsDTO]
- name: InvestmentEntity
  id_field: investmentEntityId
  aliases: [externalInvestmentEntityId]
  description: The entity being invested in, on a transaction.
- name: OwnerEntity
  id_field: ownerEntityId
  aliases: [externalOwnerEntityId, issuerEntityId]
  description: The entity holding the position, on a transaction. Modelled as an owner→investment mapping.
  schemas: [OwnerEntityMapping, UnifiedOwnerEntityMapping, UnifiedOwnerEntityMappingV2]

