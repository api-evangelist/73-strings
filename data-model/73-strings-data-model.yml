  schemas: [DocumentDto, EntityDocumentListResDTO]
- name: Transaction
  id_field: transactionId
  aliases: [displayId, externalTransactionSourceReferenceId]
  description: >-
    A ledger record ingested from a customer pipeline. displayId is the platform-generated stable
