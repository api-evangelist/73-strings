notes:
- >-
  The same portfolio company is addressed as entityId in asset-info/financial-data and as companyId
  in documents/qualitative-data/captable. Agents integrating across APIs must treat them as one key.
- >-
  External-reference fields (externalSecurityId, externalOwnerEntityId, externalInvestmentEntityId,
  externalTransactionSourceReferenceId) let a customer address platform objects by their own
  upstream keys on transaction ingest — the intended integration seam for data pipelines.
