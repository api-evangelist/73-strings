  /api/v1/transactionVersion:
    post:
      operationId: getTransactionVersions
      summary: Get Transaction Versions
      tags:
      - Transaction API
      description: "<p>\nThe <strong>Get Version List API</strong> retrieves all available reporting or transaction versions configured within an organization on the <strong>73Strings Transaction Product</strong>.\n</p>\n\n<p>\nEach version represents a defined data layer (for example, <em>Actuals</em>, <em>Forecast</em>, or <em>Scenario-based</em> data) that is used across financial or transactional modules for reporting and analytics.\n</p>\n\n<p>\nThis API enables clients to:\n</p>\n\n<ul>\n  <li>Fetch all available versions within the organization</li>\n  <li>Identify whether a version is active, fixed, or deletable</li>\n  <li>Integrate version selection into workflows such as creating, editing, or retrieving transactions</li>\n</ul>"
      parameters:
      - name: showHidden
        in: query
        required: false
        description: Whether to include hidden versions in the response
        schema:
          type: boolean
      - name: subscription-key
        in: header
        required: true
        description: A unique key that allows you to access and use an API
        schema:
          type: string
      - name: Content-Type
        in: header
        required: true
        description: <b>Content-Type</b> is a required request header.<br><br><ul><li>Defines the data format being sent</li><li>The value must be <b>application/json</b></li></ul>
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionVersionReqDTO'
            examples:
              default:
                value:
                  userId: 0ea63bb5-47c6-4590-9fc2-52fc180d6e8f
                  orgId: 214fa428-0f39-4c06-9343-d0c51c9b4e34
        description: Request Parameters Table.
      responses:
        '200':
          description: Successful retrieval of transaction versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionVersionResDTO'
              examples:
                Success Example:
                  description: Success Example
                  value:
                    response:
                      data:
                      - id: 0454b6bb-ea69-4dc0-9c45-a4e34849e71d
                        name: Actuals
                        description: Actuals version
                        sortOrder: 0
                        isEnabled: true
                        isFixed: true
                        isDeletable: false
                      - id: edb1136e-c177-445f-a52a-151ebdd9379e
                        name: Forecast
                        description: Forecast version
                        sortOrder: 0
                        isEnabled: true
                        isFixed: true
                        isDeletable: false
                      - id: 7c4afcd9-8049-4e59-8d81-4e31bb034a4e
                        name: dummy version
                        description: null
                        sortOrder: 0
                        isEnabled: false
                        isFixed: null
                        isDeletable: true
                    success: true
                    message: Success
                    errorCode: null
        '202':
          description: Request accepted for processing, but not yet completed.
          content:
            application/json:
              examples:
