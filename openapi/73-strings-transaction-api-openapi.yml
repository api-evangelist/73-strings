components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: subscription-key
      in: header
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
  schemas:
    CreateTransactionReqDTO:
      required:
      - userId
      - orgId
      - TransactionData
      type: object
      properties:
        userId:
          type: string
          description: Unique identifier of the user.
          example: 0ea63bb5-47c6-4590-9fc2-52fc180d6e8f
        orgId:
          type: string
          description: Unique identifier of the organization.
          example: 214fa428-0f39-4c06-9343-d0c51c9b4e34
        TransactionData:
          type: array
          items:
            $ref: '#/components/schemas/TransactionData'
          description: Array of transaction data objects
      description: Request parameters for creating a transaction
    UpdateTransactionReqDTO:
      required:
      - userId
      - orgId
      - transactionId
      - transactionTypeId
      - transactionDate
      - versionId
      - baseCurrency
      - baseCurrencyUnit
      - amount
      - investmentEntityId
      type: object
      properties:
        userId:
          type: string
          description: Unique identifier of the user.
          example: 0ea63bb5-47c6-4590-9fc2-52fc180d6e8f
        orgId:
          type: string
          description: Unique identifier of the organization.
          example: 214fa428-0f39-4c06-9343-d0c51c9b4e34
        transactionId:
          type: string
          description: Unique identifier of the transaction to be updated.
          example: eb74ff3a-f0a7-487f-9d2c-481112dc6c06
        transactionTypeId:
          type: string
          description: Unique identifier for the transaction type
          example: 75f88f60-d96e-4912-80f0-f8e148576848
        transactionDate:
          type: string
          description: Date of the transaction
          format: date
          example: '2025-09-08'
        versionId:
          type: string
          description: Unique identifier for the version
          example: 0454b6bb-ea69-4dc0-9c45-a4e34849e71d
        baseCurrency:
          type: string
          description: Base currency code
          example: GBP
        baseCurrencyUnit:
          type: string
          description: Unit for base currency
          example: Millions
        amount:
          type: number
          description: Transaction amount
          example: 50
        asOfDate:
          type: string
          description: As of date for the transaction
          format: date
          example: '2025-09-08'
        localAmount:
          type: number
          description: Local currency amount
          example: 0
        localCurrency:
          type: string
          description: Local currency code
          example: SAR
        localCurrencyUnit:
          type: string
          description: Unit for local currency
          example: Actual
        multilayeredTransactionMetadata:
          $ref: '#/components/schemas/MultilayeredTransactionMetadata'
        ownerEntityMappings:
          type: array
          items:
            $ref: '#/components/schemas/OwnerEntityMapping'
          description: Array of owner entity mappings
        investmentEntityId:
          type: string
          description: Unique identifier for the investment entity
          example: ae43ae8f-5fa8-46fa-b8b1-7482e45ff1d7
        reportingAmount:
          type: number
          description: Reporting currency amount
          nullable: true
        reportingCurrency:
          type: string
          description: Reporting currency code
          nullable: true
        reportingCurrencyUnit:
          type: string
          description: Unit for reporting currency
          example: Actual
        displayId:
          type: integer
          description: Display ID of the transaction
          example: 7785749
      description: Request parameters for updating a transaction
    TransactionVersionReqDTO:
      required:
      - userId
      - orgId
      type: object
      properties:
        userId:
          type: string
          description: Unique identifier of the user, provided by 73 Strings platform.
          example: 0ea63bb5-47c6-4590-9fc2-52fc180d6e8f
        orgId:
          type: string
          description: 'Unique organization ID associated with the user. Authenticates Organization using the subscription key. '
          example: 214fa428-0f39-4c06-9343-d0c51c9b4e34
      description: Request Parameters Table
    TransactionTypeReqDTO:
      required:
      - userId
      - orgId
      - filters
      - sortList
      type: object
      properties:
        userId:
          type: string
          description: Unique identifier of the user, provided by 73 Strings platform.
          example: 0ea63bb5-47c6-4590-9fc2-52fc180d6e8f
        orgId:
          type: string
          description: Unique organization ID associated with the user. Authenticates Organization using the subscription key.
          example: 214fa428-0f39-4c06-9343-d0c51c9b4e34
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
          description: Defines the filter criteria for transaction classification such as CASH_FLOW or VALUATION.
        sortList:
          type: array
          items:
            $ref: '#/components/schemas/SortCriteria'
          description: Defines the sorting logic of the result set.
      description: Request parameters for retrieving transaction types
    TransactionDataReqDTO:
      required:
      - userId
      - orgId
      type: object
      properties:
        userId:
          type: string
          description: Unique identifier of the user.
          example: 0ea63bb5-47c6-4590-9fc2-52fc180d6e8f
        orgId:
          type: string
          description: Unique identifier of the organization.
          example: 214fa428-0f39-4c06-9343-d0c51c9b4e34
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
          description: Array of filters to apply
        sortList:
          type: array
          items:
            $ref: '#/components/schemas/SortCriteria'
          description: Array of sort criteria
        asOfDateSettings:
          type: string
          description: As of date settings for transaction data
          example: LATEST
      description: Request parameters for retrieving transaction data
    UnifiedTransactionReqDTO:
      required:
      - userId
      - orgId
      - TransactionData
      type: object
      properties:
        userId:
          type: string
          description: Unique identifier of the user, provided by 73 Strings platform.
          example: 1a4b3a64-7317-49f2-a0eb-7f023cbd341a
        orgId:
          type: string
          description: 'Unique organization ID associated with the user. Authenticates Organization using the subscription key. '
          example: b10d0b32-e50b-41ff-80cb-8b5b0adb054a
        TransactionData:
          type: array
          items:
            $ref: '#/components/schemas/UnifiedTransactionData'
          description: A list containing one or more transaction records. Each record holds detailed information about a specific transaction event.
      description: Request parameters for unified create/update transaction
    UnifiedTransactionV2ReqDTO:
      required:
      - userId
      - orgId
      - TransactionData
      type: object
      properties:
        userId:
          type: string
          description: Unique identifier of the user submitting the request. The user must be authorized for the organization associated with the subscription key.
          format: uuid
          example: d2dae30f-7570-4f24-8cc5-e7ead4baf458
        orgId:
          type: string
          description: Unique identifier of the organization. This value must match the organization scope associated with the subscription key.
          format: uuid
          example: cfcbb891-1838-48e7-98db-57142094123c
        TransactionData:
          maxItems: 2000
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/UnifiedTransactionV2Data'
          description: Array of transaction objects to create or update. Empty arrays are rejected. The total request payload must not exceed 5 MB.
      description: V2 request parameters for bulk create/update transaction processing.
    UnifiedTransactionV2Data:
      required:
      - transactionTypeId
      - versionId
      - transactionDate
      - baseCurrency
      - baseCurrencyUnit
      - amount
      - multilayeredTransactionMetadata
      - ownerEntityMappings
      - investmentEntityId
      type: object
      properties:
        transactionTypeId:
          type: string
          description: Unique identifier of an active transaction type. Retrieve valid IDs from the Transaction Type API.
          format: uuid
          example: c0292085-1818-460f-94d3-f92079326358
        transactionDate:
          type: string
          description: 'Date on which the transaction occurred. Use ISO 8601 format: YYYY-MM-DD.'
          format: date
          example: '2025-11-16'
        versionId:
          type: string
          description: Unique identifier of the transaction version. Retrieve valid IDs from the Transaction Version API.
          format: uuid
          example: 9c78a3b4-0f37-4de0-a289-d52bc04f3615
        asOfDate:
          pattern: ^$|^\d{4}-\d{2}-\d{2}$
          type: string
          description: Optional as-of date for the transaction data point. When provided, use YYYY-MM-DD format. If omitted or sent as an empty value, the platform uses the date on which the transaction is pushed. Together with externalTransactionSourceReferenceId, the effective as-of date determines whether the request creates a new transaction, overwrites an existing as-of-date instance, or adds a new instance.
          example: '2025-11-10'
        baseCurrency:
          maxLength: 3
          minLength: 3
          type: string
          description: ISO 4217 three-letter base currency code. The value is case-sensitive.
          example: GBP
        baseCurrencyUnit:
          enum:
          - Actual
          - Lakhs
          - Millions
          - Crores
          - Billions
          - Trillions
          type: string
          description: Scale in which the base amount is provided. Allowed values are Actual, Lakhs, Millions, Crores, Billions, and Trillions. The value is case-sensitive.
          example: Lakhs
        amount:
          type: number
          description: Transaction amount in the base currency. Decimal values up to Decimal(42,17) are supported; zero, positive, and negative values are allowed.
          format: decimal
          example: 50
        localCurrency:
          maxLength: 3
          minLength: 3
          type: string
          description: ISO 4217 three-letter local currency code. If any local amount field is provided, localAmount, localCurrency, and localCurrencyUnit must all be provided.
          example: INR
        localCurrencyUnit:
          enum:
          - Actual
          - Lakhs
          - Millions
          - Crores
          - Billions
          - Trillions
          type: string
          description: Scale in which the local amount is provided. Allowed values are Actual, Lakhs, Millions, Crores, Billions, and Trillions. The value is case-sensitive. If any local amount field is provided, localAmount, localCurrency, and localCurrencyUnit must all be provided.
          example: Actual
        localAmount:
          type: number
          description: Transaction amount in local currency. Decimal values up to Decimal(42,17) are supported; zero, positive, and negative values are allowed. If provided, localCurrency and localCurrencyUnit are also required.
          format: decimal
          example: 4000
        multilayeredTransactionMetadata:
          $ref: '#/components/schemas/UnifiedMultilayeredTransactionV2Metadata'
        ownerEntityMappings:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/UnifiedOwnerEntityMappingV2'
          description: Owner entity mappings for the transaction. Each ownerEntityId must be a valid owner or immediate parent entity for the investment entity.
        investmentEntityId:
          type: string
          description: Unique 73 Strings system identifier of the investment entity associated with the transaction. Retrieve valid IDs from the Entity List API.
          format: uuid
          example: 64f1db13-91cc-46be-85f1-a963cec04899
        reportingAmount:
          type: number
          description: Transaction amount in reporting currency. Decimal values up to Decimal(42,17) are supported; zero, positive, and negative values are allowed. If any reporting amount field is provided, reportingAmount, reportingCurrency, and reportingCurrencyUnit must all be provided.
          format: decimal
          example: 2000
        reportingCurrency:
          maxLength: 3
          minLength: 3
          type: string
          description: ISO 4217 three-letter reporting currency code. If any reporting amount field is provided, reportingAmount, reportingCurrency, and reportingCurrencyUnit must all be provided.
          example: USD
        reportingCurrencyUnit:
          enum:
          - Actual
          - Lakhs
          - Millions
          - Crores
          - Billions
          - Trillions
          type: string
          description: Scale in which the reporting amount is provided. Allowed values are Actual, Lakhs, Millions, Crores, Billions, and Trillions. The value is case-sensitive. If any reporting amount field is provided, reportingAmount, reportingCurrency, and reportingCurrencyUnit must all be provided.
          example: Actual
      description: V2 transaction object. displayId is generated by the platform and is not accepted in the request payload. asOfDate is optional; if it is omitted or empty, the platform uses the date on which the transaction is pushed.
    UnifiedMultilayeredTransactionV2Metadata:
      type: object
      properties:
        remarks:
          maxLength: 300
          type: string
          description: Free-text notes for the transaction.
          example: API pushed transaction
        securityId:
          type: string
          description: Unique 73 Strings system identifier of the security under the investment entity and owner entity. If securityId is provided, securityType must also be provided.
          format: uuid
          example: 2601e54d-b5ea-4178-9b19-3b5551f1de7e
        securityType:
          enum:
          - EQUITY
          - CREDIT
          type: string
          description: Type of security involved in the transaction. Allowed values are EQUITY and CREDIT. The value is case-sensitive and must be uppercase. If securityType is provided, securityId must also be provided.
          example: CREDIT
        externalTransactionSourceReferenceId:
          maxLength: 255
          type: string
          description: Client-provided primary reference for the logical transaction. Together with the effective asOfDate, this field determines create/update behavior. Use a stable value across submissions for the same logical transaction. If omitted or new, the platform creates a new transaction; if the value exists with the same effective asOfDate, the existing row is fully overwritten; if the value exists with a new effective asOfDate, a new time-series instance is created.
          example: EY - transactions 1
        pps:
          minimum: 0
          exclusiveMinimum: true
          type: number
          description: Price per share. Must be greater than 0 when provided.
          example: 10.04
        postMoneyValuation:
          type: number
          description: Post-money valuation amount. Decimal values up to Decimal(42,17) are supported; zero, positive, and negative values are allowed. If any post-money valuation field is provided, postMoneyValuation, postMoneyValuationCurrency, and postMoneyValuationCurrencyUnit must all be provided.
          format: decimal
          example: 29404.429
        postMoneyValuationCurrency:
          maxLength: 3
          minLength: 3
          type: string
          description: ISO 4217 three-letter currency code for post-money valuation. If any post-money valuation field is provided, all post-money valuation amount, currency, and unit fields must be provided.
          example: USD
        postMoneyValuationCurrencyUnit:
          enum:
          - Actual
          - Lakhs
          - Millions
          - Crores
          - Billions
          - Trillions
          type: string
          description: Scale in which post-money valuation is provided. Allowed values are Actual, Lakhs, Millions, Crores, Billions, and Trillions. The value is case-sensitive. If any post-money valuation field is provided, all post-money valuation amount, currency, and unit fields must be provided.
          example: Lakhs
        ownershipPercentage:
          maximum: 100
          minimum: 0
          type: number
          description: Ownership percentage for the transaction. Must be between 0 and 100 when provided.
          format: decimal
          example: 60.2242
        externalInvestmentEntityId:
          maxLength: 255
          type: string
          description: Client-provided external identifier for the investment entity.
          example: CEN02570
        externalSecurityId:
          maxLength: 255
          type: string
          description: Client-provided external identifier for the security.
          example: CEN003100
        shareCount:
          minimum: 0
          exclusiveMinimum: true
          type: number
          description: Number of shares. Must be greater than 0 when provided.
          example: 10
        vehicleName:
          maxLength: 255
          type: string
          description: SPV or vehicle name associated with the transaction.
          example: SPV-1
        externalOwnerEntityId:
          maxLength: 255
          type: string
          description: Client-provided external identifier for the owner entity.
          example: samplePS
      description: V2 transaction metadata containing source references, security details, valuation details, ownership metrics, and optional external IDs.
    UnifiedOwnerEntityMappingV2:
      required:
      - ownerEntityId
      type: object
      properties:
        ownerEntityId:
          type: string
          description: Unique 73 Strings system identifier of the owner or parent entity associated with the investment entity. Retrieve valid IDs from the Entity List API.
          format: uuid
          example: 0ea98f32-5393-441c-b7b0-7e6cc17c485a
      description: V2 owner entity mapping for a transaction.
    UnifiedMultilayeredTransactionMetadata:
      type: object
      properties:
        remarks:
          type: string
          description: Notes or comments entered for internal or audit purposes.
          example: sample
        securityId:
          type: string
          description: System generated unique Identifier of the security, which is issued by the Investment Entity and subscribed by Owner Entity. Use GET EntitySecuritiesList API operation to retrieve the security ID
          example: ''
        securityType:
          type: string
          description: 'Type of the security involved in the transaction. Allowed values are: [EQUITY, CREDIT].'
          example: ''
        securityName:
          type: string
          description: Name of the security (for informatiional purpose only , not used to identify or populate security's detail in the trasactions)
          example: ''
        externalTransactionSourceReferenceId:
          type: string
          description: External system or source reference ID for the transaction. Used for traceability during system integrations.
          example: sampletest
        pps:
          type: number
          description: Price per share (PPS) for the transaction. Relevant for equity-based transactions.
          example: 10
        postMoneyValuation:
          type: number
          description: Post-money valuation of the entity after investment or distribution. Pass null, inorder to pass empty post money valuation amount. Input the values for all three post money valuation currencies field, or pass nothing for these fields to log empty value.
          example: 100
        postMoneyValuationCurrency:
          type: string
          description: 'Currency name in which post-money valuation is reported. Allowed inputs are: ISO4217 currency codes.'
          example: USD
        postMoneyValuationCurrencyUnit:
          type: string
          description: 'Denotes the scale of post money valuation amount, Allowed inputs are: [Actual, Lakhs, Millions, Crores, Billions, Trillions].'
          example: Actual
        ownershipPercentage:
          type: number
          description: Ownership Percentage of owner entity in the investment. Should lie between 0 and 100
          example: 50
