      description: Multilayered transaction metadata
    UnifiedOwnerEntityMapping:
      required:
      - ownerEntityId
      type: object
      properties:
        ownerEntityId:
          type: string
          description: Unique ID of owner (parent) entity generated by the platform. This can be retreived from EntityListAPI operation.
          example: 0ea98f32-5393-441c-b7b0-7e6cc17c485a
      description: Unified owner entity mapping details using names
    UnifiedTransactionData:
      required:
      - transactionTypeId
      - versionId
      - transactionDate
      - baseCurrency
      - baseCurrencyUnit
      - amount
      - ownerEntityMappings
      - investmentEntityId
      type: object
      properties:
        transactionTypeId:
          type: string
          description: Unique ID representing transaction type. This can be retrieved from transactionType API operation.
          example: '23796437'
        displayId:
          type: string
          description: Display ID of the transaction populated on the platform. This field becomes mandatory in order to update the existing transaction
          example: '23796437'
        asOfDate:
          type: string
          description: As of date for the transaction.
          format: YYYY-MM-DD
          example: '2020-01-01'
        transactionDate:
          type: string
          description: The effective date when the transaction occurred.
          format: YYYY-MM-DD
          example: '2020-01-01'
        versionId:
          type: string
          description: Unique ID of the transaction record’s version for reporting context (e.g., Forecast, Actuals). This can be retrieved from transactionVersion API operation.
          example: 3239-29XXXX-98492-XXXXX-398989874893209
        baseCurrency:
          type: string
          description: 'Denotes the currency of the base transactional amount. Allowed inputs are: ISO4217 currency codes.'
          example: USD
        baseCurrencyUnit:
          type: string
          description: 'Scale of the Base currency amount , Allowed inputs are: [Actual, Lakhs, Millions, Crores, Billions, Trillions].'
          example: Actual
        amount:
          type: number
          description: Amount of the transaction in base currency. This field becomes mandatory in order to update the existing transaction
          example: 500
        localCurrency:
          type: string
          description: 'The local currency in which the transaction is recorded. Allowed inputs are: ISO4217 currency codes.'
          example: INR
        localCurrencyUnit:
          type: string
          description: 'Denotes the scale of the local transactional amount , Allowed inputs are: [Actual, Lakhs, Millions, Crores, Billions, Trillions].'
          example: Actual
        localAmount:
          type: number
          description: Amount of the transaction in the local currency. Pass null, inorder to pass empty local amount. Input the values for all three local currencies field, or pass nothing for these fields to log empty value.
          example: 10000
        multilayeredTransactionMetadata:
          $ref: '#/components/schemas/UnifiedMultilayeredTransactionMetadata'
        ownerEntityMappings:
          type: array
          items:
            $ref: '#/components/schemas/UnifiedOwnerEntityMapping'
          description: A list containing information on investment entity’s parent and grand-parents (ancestors) in the same hierarchy.
        investmentEntityId:
          type: string
          description: Unique ID of the investment entity generated by the platform. This can be retreived from EntityListAPI operation.
          example: 233948-293XXX-309840XXX-938493234
        reportingAmount:
          type: number
          description: Transaction amount in the designated reporting currency. Pass null, inorder to pass empty reporting amount. Input the values for all three reporting currencies field, or pass nothing for these fields to log empty value.
          example: 500.034
        reportingCurrency:
          type: string
          description: 'The currency in which the transaction’s reporting values are recorded. Allowed inputs are: ISO4217 currency codes.'
          example: USD
        reportingCurrencyUnit:
          type: string
          description: 'Denotes the scale of reporting transactional amount, Allowed inputs are: [Actual, Lakhs, Millions, Crores, Billions, Trillions].'
          example: Actual
      description: A list containing one or more transaction records. Each record holds detailed information about a specific transaction event.
