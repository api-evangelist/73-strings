                        Gross_Profit: 10
                        Selling_General_and_Admin: 10
                        Other_Expenses: 10
                        Total_Operating_Expenses: 10
                        EBITDA: 10
                        Depreciation_and_Amortization: 10
        description: Request body containing company financial data.
      responses:
