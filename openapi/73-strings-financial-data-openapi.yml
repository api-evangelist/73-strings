    post:
      operationId: companyFinancialData
      summary: Save Entity Financial Data
      tags:
      - Financial Data
      description: 'The 73Value Equity product offers robust tools for the valuation of companies, utilizing various financial metrics to provide accurate and insightful assessments. The **putCompanyFinancialData API** is designed to facilitate the creation or updating of financial statement metrics and their data value for various companies.


        This API handles both historical and projected financial data, allowing users to input financials for different cash flow dates and frequency periods. By integrating this data into the 73Value Equity system, users can ensure that their company valuations are based on comprehensive and up-to-date financial information.


        This API is essential for fund managers, analysts, and investors who need to maintain accurate financial records and perform detailed valuations. By leveraging the capabilities of the 73Value Equity product, users can streamline their financial data management and enhance their valuation processes.'
