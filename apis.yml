aid: 73-strings
name: 73 Strings
description: >-
  73 Strings is an AI-powered financial technology company serving alternative asset managers in
  private equity, private credit, venture capital, infrastructure and multi-strategy funds. Its
  platform digitises the valuation and portfolio-monitoring lifecycle for illiquid assets through
  three products — 73 Value (audit-ready equity and credit valuations), 73 Monitor (portfolio
  monitoring and analytics) and 73 Extract (AI extraction of unstructured private-market documents
  into structured data). 73 Strings exposes a REST API surface through Microsoft Azure API
  Management developer portals, covering asset information, cap tables, documents, financial data,
  qualitative data and transaction-ledger ingestion, all authenticated with a subscription key and
  scoped by organization and user identifiers. The company is headquartered in Paris with offices in
  London, New York, San Francisco, Singapore, Riyadh, Abu Dhabi, Bengaluru and Hyderabad, and is
  backed by Blackstone, Goldman Sachs, Hamilton Lane, Golub Capital and Broadhaven.
