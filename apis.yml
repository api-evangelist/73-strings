- aid: 73-strings:73-strings-transaction-api-api
  name: 73 Strings Transaction API API
  description: >-
    The <b>Transaction APIs</b> enable external enterprise customers to <b>ingest and retrieve transaction
    ledger records</b> within the <b>73 Strings platform</b>.<br><br>These APIs are intended for <b>client-side
    engineering teams</b> that manage their own data pipelines and require a <b>controlled, structured
    interface</b> to push transaction data into the platform or retrieve processed transaction information
    for downstream workflows.<br><br><b>Key capabilities</b><ul><li>Bulk creation and update of transaction
    ledger records</li><li>Platform-generated <b>Display IDs</b> for stable referencing across workflows</li><li>Retrieval
    of processed transaction data</li><li>Reference APIs for <b>transaction types</b> and <b>transaction
    versions</b> to ensure payload correctness</li><li>Partial success handling for bulk ingestion</li></ul><b>Authentication
    &amp; data scoping</b><ul><li>All APIs are authenticated using a <b>subscription key</b> associated
    with a <b>User ID</b></li><li><b>Organization ID</b> and <b>User ID</b> are mandatory in request payloads
    and determine data access</li><li>APIs are multi-tenant by design and return data scoped to the provided
    organization</li></ul><b>Processing model</b><ul><li>Transactions are pushed via external pipelines
    (real-time or batch)</li><li>The platform persists and processes the data as per supported transaction
    structures</li><li>The APIs do not orchestrate synchronization or enforce real-time guarantees</li></ul>
  humanURL: https://api-accord-eut-73strings.developer.azure-api.net/api-details#api=asset-info
  baseURL: https://api-accord-eut-73strings.azure-api.net/assetinfo
  tags:
  - Transaction API
